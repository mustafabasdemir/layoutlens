<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Case 6 — hidden elements</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      .gone { display: none; width: 2000px; height: 40px; }
      .skip-link { position: absolute; left: -9999px; top: 0; width: 200px; }
      .skip-link:focus { left: 8px; }
      .faded-offscreen { position: absolute; top: 100px; left: -600px; width: 400px; height: 40px; opacity: 0; }
      /* Bug: invisible, yet still 1000px wide in the layout, so the page scrolls into blank space. */
      .ghost-panel { visibility: hidden; width: 1000px; height: 40px; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <main id="content">
      <h1>Account</h1>
      <div class="gone">Removed from layout</div>
      <div class="faded-offscreen">Faded toast</div>
      <div id="ghost-panel" class="ghost-panel">Lazy panel</div>
    </main>
  </body>
</html>
