<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Case 2 — fixed-width element exceeding the viewport</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      main { padding: 16px; }
      .pricing-table { width: 720px; border: 1px solid #ccc; padding: 12px; box-sizing: border-box; }
      .pricing-table p { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Plans</h1>
      <div id="pricing" class="pricing-table">
        <p>Starter · Team · Enterprise</p>
      </div>
    </main>
  </body>
</html>
