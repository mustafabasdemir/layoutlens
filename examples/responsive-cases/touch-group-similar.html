<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Touch — grouped similar small targets</title>
  <style>
    body { margin: 16px; font-family: system-ui, sans-serif; }
    .toolbar {
      display: flex; gap: 4px; flex-wrap: wrap;
      padding: 8px; border: 1px solid #ccc; max-width: 360px;
    }
    .toolbar button {
      padding: 2px 4px; font-size: 11px; min-width: 0;
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Demo toolbar">
    <button type="button">One</button>
    <button type="button">Two</button>
    <button type="button">Thr</button>
    <button type="button">Fou</button>
    <button type="button">Fiv</button>
  </nav>
</body>
</html>
