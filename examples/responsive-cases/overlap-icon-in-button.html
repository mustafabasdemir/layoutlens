<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlap — icon inside button (negative)</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #go { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; }
    #go svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <button type="button" id="go"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="currentColor"/></svg> Save</button>
</body>
</html>
