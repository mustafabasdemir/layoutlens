<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offscreen — closed nav (negative)</title>
  <style>
    body { margin: 0; }
    #drawer {
      position: fixed; left: -280px; top: 0; width: 260px; height: 100vh;
      background: #111; overflow: hidden;
    }
    #drawer a { display: block; padding: 12px; color: #fff; }
  </style>
</head>
<body>
  <p>Visible page</p>
  <nav id="drawer" aria-hidden="true">
    <a href="#home">Home</a>
    <a href="#about">About</a>
  </nav>
</body>
</html>
