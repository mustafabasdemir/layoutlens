<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text clip — ellipsis (negative)</title>
  <style>
    body { margin: 16px; font-family: system-ui, sans-serif; }
    #ok {
      width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
  </style>
</head>
<body>
  <p id="ok">Intentional summary line that truncates with ellipsis</p>
</body>
</html>
