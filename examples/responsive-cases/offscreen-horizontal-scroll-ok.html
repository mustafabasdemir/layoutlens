<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offscreen — horizontal scroll available (negative)</title>
  <style>
    body { margin: 0; overflow-x: auto; }
    #track { width: 1200px; height: 80px; position: relative; }
    #btn { position: absolute; left: 500px; top: 20px; padding: 10px 16px; }
  </style>
</head>
<body>
  <div id="track">
    <button type="button" id="btn">Past edge but scrollable</button>
  </div>
</body>
</html>
